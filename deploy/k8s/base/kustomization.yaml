apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: my-test-project-dev
resources:
  - namespace.yaml
  - server/configmap.yaml
  - server/secret.yaml
  - server/deployment.yaml
  - server/service.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - postgres/statefulset.yaml
  - postgres/service.yaml
configMapGenerators:
  - name: postgres-init
    files:
      - init.sql=../../docker-compose/init.sql
