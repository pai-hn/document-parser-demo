apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: my-test-project-database
spec:
  serviceName: my-test-project-database
  replicas: 1
  selector:
    matchLabels:
      app: my-test-project-database
  template:
    metadata:
      labels:
        app: my-test-project-database
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_DB
              value: my_test_project
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
            - name: init-sql
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: init-sql
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: dedicated-storage
        resources:
          requests:
            storage: 1Gi
